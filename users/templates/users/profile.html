{% extends "site_base.html" %}
{% block title %}پروفایل · {{ venue.name }}{% endblock %}
{% block content %}
<div class="container" style="max-width:520px;padding-top:48px">
  <div class="card text-center">
    <span class="stat-icon" style="margin:0 auto 10px;width:64px;height:64px;border-radius:20px"><svg class="icon" style="width:32px;height:32px"><use href="#i-user"/></svg></span>
    <h2>{{ user.get_username }}</h2>
    <p class="muted">{{ user.email|default:"ایمیلی ثبت نشده" }}</p>
    {% if user.is_staff %}<a class="btn btn-primary btn-block" href="{% url 'vendor:dashboard' %}">پنل مدیریت</a>{% endif %}
    <form method="post" action="{% url 'logout' %}" class="mt-1">{% csrf_token %}<button class="btn btn-block" type="submit">خروج از حساب</button></form>
  </div>
</div>
{% endblock %}
